[package]
name = "basalt"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Hardened UCAN contract boundaries for Nickel and Steel policy backends."
readme = "README.md"
repository = "https://github.com/OnixResearch/basalt"
homepage = "https://github.com/OnixResearch/basalt#readme"
documentation = "https://github.com/OnixResearch/basalt#readme"
keywords = ["ucan", "nickel", "policy", "capabilities", "authorization"]
categories = ["authentication", "config"]
include = [
    "src/**",
    "tests/**",
    "contracts/policy.ncl",
    "contracts/generated/policy.json",
    "contracts/ucan-semantics/contracts.ncl",
    "contracts/ucan-semantics/fixtures/**",
    "docs/ucan-semantics-contract.md",
    "README.md",
    "Cargo.toml",
    "Cargo.lock",
]

[features]
default = []
cli = ["dep:clap"]

[[bin]]
name = "basalt"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.8"
ucan = { version = "0.1.0", git = "ssh://git@github.com/OnixResearch/ucan.git", rev = "2aad993027d48ff148028c537cdaf91f6e5285ca" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
