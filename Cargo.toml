[package]
name = "ucan-nickel-contracts"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Nickel-authored contract policy enforcement backed by UCAN capabilities."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.8"
ucan = { version = "0.1.0", git = "ssh://git@github.com/OnixResearch/ucan.git", rev = "ad61b53e89fa45f9bf7d313ce14c45de645bf53d" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
